<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRIS — Environmental Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100;9..40,200;9..40,300;9..40,400;9..40,700;9..40,900&display=swap" rel="stylesheet" />
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.98/build/spline-viewer.js"></script>

  <style>
    /* ── RESET ───────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    /* ── GRAIN ───────────────────────────────────────────────── */
    #grain {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.072;
      background-size: 220px 220px;
      background-repeat: repeat;
    }

    /* ── SECTION 2 BACKGROUND, CROPPED TO FILL THE VIEWPORT ───── */
    .section-blank {
      position: relative;
      width: 100%;
      height: 100%;
      background: #1e0c04;
      overflow: hidden;
    }

    .section-blank::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 62%;
      height: 38vh;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #1e0c04 0%,
        #1e0c04 24%,
        rgba(30, 12, 4, 0.88) 40%,
        rgba(20, 24, 34, 0.58) 72%,
        rgba(8, 26, 42, 0) 100%
      );
      -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 82%, transparent 100%);
      mask-image: linear-gradient(90deg, #000 0%, #000 82%, transparent 100%);
    }

    /* curvy diagonal split — SVG positioned inside */
    .split-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .spline-wrap-2 {
      position: absolute;
      left: 15%;
      right: 11%;
      top: 0;
      bottom: 0;
      z-index: 1;
      pointer-events: none;
      transform: scale(2.43);
      transform-origin: 50% 60%;
    }

    .spline-wrap-2 spline-viewer {
      width: 100%;
      height: 100%;
      --spline-background: transparent;
    }

    /* ── STATIC "IRIS." LABEL, LEFT-ALIGNED ─────────────────────
       Replaces the auto-cycling feature card carousel — portfolio
       preview only, no interactive/backend logic. */
    .iris-label {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 8%;
      pointer-events: none;
    }

    .iris-label span {
      font-size: clamp(3rem, 9vw, 7rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.92);
    }
  </style>
</head>
<body>

  <!-- GRAIN OVERLAY — populated by JS -->
  <div id="grain" aria-hidden="true"></div>

  <!-- ─────────── SECTION 2 (cropped standalone) ─────────── -->
  <section class="section-blank" id="features">

    <div class="iris-label">
      <span>Iris.</span>
    </div>

    <svg class="split-svg" preserveAspectRatio="none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="#082433"/>
          <stop offset="22%"  stop-color="#0d3345"/>
          <stop offset="46%"  stop-color="#174f63"/>
          <stop offset="72%"  stop-color="#2c666d"/>
          <stop offset="100%" stop-color="#3C6E6B"/>
        </linearGradient>
        <linearGradient id="darkBase" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="#1e0c04"/>
          <stop offset="24%"  stop-color="#1e0c04"/>
          <stop offset="42%"  stop-color="#1b1009"/>
          <stop offset="66%"  stop-color="#141b25"/>
          <stop offset="84%"  stop-color="#0f2b3f"/>
          <stop offset="100%" stop-color="#081a2a"/>
        </linearGradient>
        <radialGradient id="blueWash1" cx="82%" cy="28%" r="42%">
          <stop offset="0%"   stop-color="#1a5a78" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#1a5a78" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="blueWash2" cx="60%" cy="78%" r="38%">
          <stop offset="0%"   stop-color="#0c3854" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#0c3854" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="edgeDepth" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="rgba(0,0,0,0)"/>
          <stop offset="60%"  stop-color="rgba(0,0,0,0)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0.45)"/>
        </linearGradient>
      </defs>
      <path d="M0,0 L100,0 C70,0 30,100 0,100 Z" fill="url(#darkBase)"/>
      <path d="M0,0 L100,0 C70,0 30,100 0,100 Z" fill="url(#edgeDepth)"/>
      <path d="M100,0 L100,100 L0,100 C30,100 70,0 100,0 Z" fill="url(#tealGrad)"/>
      <path d="M100,0 L100,100 L0,100 C30,100 70,0 100,0 Z" fill="url(#blueWash1)"/>
      <path d="M100,0 L100,100 L0,100 C30,100 70,0 100,0 Z" fill="url(#blueWash2)"/>
      <path d="M100,0 C70,0 30,100 0,100" fill="none" stroke="rgba(80,200,240,0.22)" stroke-width="0.6"/>
      <path d="M100,0.8 C70,0.8 30,100.8 0,100.8" fill="none" stroke="rgba(0,0,0,0.20)" stroke-width="0.5"/>
    </svg>

    <div class="spline-wrap-2">
      <spline-viewer
        url="https://prod.spline.design/FKY2HIHCAFJZyFxB/scene.splinecode"
        background="transparent"
      ></spline-viewer>
    </div>

  </section>

  <script>
    /* ── ANIMATED CANVAS GRAIN ──────────────────────────────────
       Generates a fresh 220×220 random noise tile every 80 ms
       and assigns it as a tiling background — true animated
       film grain that works in every modern browser.
    ─────────────────────────────────────────────────────────── */
    (function () {
      const el     = document.getElementById('grain');
      const SIZE   = 220;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = SIZE;
      const ctx = canvas.getContext('2d');

      function tick() {
        const img = ctx.createImageData(SIZE, SIZE);
        const d   = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = (Math.random() * 255) | 0;
          d[i] = d[i + 1] = d[i + 2] = v;
          d[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        el.style.backgroundImage = `url(${canvas.toDataURL('image/png')})`;
      }

      tick();
      setInterval(tick, 80);
    })();

    /* ── HIDE "BUILT WITH SPLINE" BADGE ─────────────────────────
       The badge is inside the viewer's shadow DOM. Inject a style
       that hides any anchor pointing to spline.design.           */
    (function () {
      const viewer = document.querySelector('.spline-wrap-2 spline-viewer');
      if (!viewer) return;
      function hideBadge() {
        try {
          const shadow = viewer.shadowRoot;
          if (!shadow) return;
          if (shadow.querySelector('#spline-badge-hide')) return;
          const s = document.createElement('style');
          s.id = 'spline-badge-hide';
          s.textContent = [
            'a[href*="spline"]',
            '[class*="logo"]',
            '[class*="badge"]',
            '[class*="watermark"]',
          ].join(',') + '{ display:none!important; }' +
          'canvas, div { background: transparent !important; }';
          shadow.appendChild(s);
        } catch (e) {}
      }
      viewer.addEventListener('load', hideBadge);
      setTimeout(hideBadge, 1500);
      setTimeout(hideBadge, 4000);
    })();
  </script>

</body>
</html>
